[project]
name = "ai-chall"
version = "0.1.0"
description = "AI Advent Challenge #8 — daily assignments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["weeks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["weeks"]
pythonpath = ["."]
