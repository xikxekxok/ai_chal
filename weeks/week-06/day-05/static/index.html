<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анекдоты про опоссумов</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
  <div class="app" x-data="jokeApp()" x-init="init()">
    <header class="header">
      <div>
        <h1>🦝 Анекдоты про опоссумов</h1>
        <p x-text="subtitle"></p>
      </div>
      <div class="header-actions">
        <button
          type="button"
          class="secondary clear-btn"
          @click="clearResults()"
          :disabled="loading || results.length === 0"
          title="Очистить список анекдотов"
        >
          Очистить
        </button>
      </div>
    </header>

    <section class="theme-panel">
      <div class="theme-panel-head">
        <h2>Выбери темы</h2>
        <span class="theme-count" :class="{ warn: selectedCount === 0 }" x-text="`Выбрано: ${selectedCount}/10`"></span>
      </div>
      <div class="theme-grid">
        <template x-for="theme in themes" :key="theme.id">
          <label class="theme-item" :class="{ selected: theme.selected }">
            <input
              type="checkbox"
              :value="theme.id"
              x-model="theme.selected"
              :disabled="loading"
            >
            <span x-text="theme.label"></span>
          </label>
        </template>
      </div>
      <button
        type="button"
        class="generate-btn"
        @click="generate()"
        :disabled="loading || selectedCount < 1 || !localAvailable"
      >
        Сгенерировать
      </button>
    </section>

    <div class="messages">
      <template x-if="results.length === 0 && !streaming.active && !loading">
        <div class="empty">
          <p>Отметь от 1 до 10 тем и нажми «Сгенерировать» — локальная LLM напишет анекдот.</p>
        </div>
      </template>

      <template x-for="(item, idx) in results" :key="idx">
        <div class="msg assistant">
          <div class="msg-label" x-text="formatThemes(item.themeLabels)"></div>
          <template x-if="item.thinking">
            <div class="thinking-block">
              <button
                type="button"
                class="thinking-toggle"
                @click="toggleThinking(idx)"
              >
                <span x-text="isThinkingCollapsed(item) ? '▸' : '▾'"></span>
                <span>Размышление</span>
              </button>
              <div
                class="thinking-body"
                x-show="!isThinkingCollapsed(item)"
                x-cloak
                x-text="item.thinking"
              ></div>
            </div>
          </template>
          <div class="answer-body" x-text="item.content"></div>
        </div>
      </template>

      <template x-if="streaming.active">
        <div class="msg assistant streaming">
          <div class="msg-label" x-text="formatThemes(streaming.themeLabels)"></div>
          <template x-if="streaming.thinking">
            <div class="thinking-body has-text" x-text="streaming.thinking"></div>
          </template>
          <template x-if="!streaming.thinking && streaming.loading">
            <div class="thinking-body"></div>
          </template>
          <div class="answer-body" x-text="streaming.content"></div>
        </div>
      </template>
    </div>

    <div class="status" :class="{ error: error, warn: trimmed && !error }" x-text="statusText"></div>
  </div>

  <script>
    function jokeApp() {
      return {
        themes: [],
        results: [],
        loading: false,
        localAvailable: false,
        localModel: "",
        error: "",
        trimmed: false,
        lastLatencyMs: null,
        streaming: {
          active: false,
          loading: false,
          thinking: "",
          content: "",
          themeLabels: [],
        },

        get selectedCount() {
          return this.themes.filter((t) => t.selected).length;
        },

        get subtitle() {
          const model = this.localModel ? ` · ${this.localModel}` : "";
          return `локальная Ollama${model}`;
        },

        get statusText() {
          if (this.error) return this.error;
          const parts = ["[local]"];
          if (this.trimmed) parts.push("Контекст обрезан (max context)");
          if (this.lastLatencyMs != null) parts.push(`${this.lastLatencyMs} ms`);
          if (this.loading) parts.push("генерация…");
          return parts.join(" · ");
        },

        async init() {
          await this.loadHealth();
          await this.loadThemes();
        },

        async loadHealth() {
          try {
            const response = await fetch("/api/health");
            const health = await response.json();
            this.localAvailable = Boolean(health.local?.ok);
            this.localModel = health.local?.model || "";
            if (!this.localAvailable) {
              this.error = "Локальная Ollama недоступна";
            }
          } catch (_) {
            this.error = "Сервер недоступен";
          }
        },

        async loadThemes() {
          try {
            const response = await fetch("/api/themes");
            const data = await response.json();
            this.themes = (data.themes || []).map((t) => ({
              id: t.id,
              label: t.label,
              selected: false,
            }));
          } catch (_) {
            this.error = "Не удалось загрузить темы";
          }
        },

        formatThemes(labels) {
          if (!labels || labels.length === 0) return "Анекдот";
          return labels.join(" · ");
        },

        selectedLabels() {
          return this.themes.filter((t) => t.selected).map((t) => t.label);
        },

        isThinkingCollapsed(item) {
          return item.thinkingCollapsed !== false;
        },

        toggleThinking(idx) {
          const item = this.results[idx];
          this.results[idx] = {
            ...item,
            thinkingCollapsed: !this.isThinkingCollapsed(item),
          };
        },

        clearResults() {
          this.results = [];
          this.error = "";
          this.trimmed = false;
          this.lastLatencyMs = null;
        },

        parseSseBlock(block) {
          let event = "message";
          let data = "";
          for (const line of block.split("\n")) {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            if (line.startsWith("data:")) data = line.slice(5).trim();
          }
          if (!data) return null;
          try {
            return { event, data: JSON.parse(data) };
          } catch (_) {
            return null;
          }
        },

        async consumeStream(response) {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";

            for (const part of parts) {
              const parsed = this.parseSseBlock(part.trim());
              if (!parsed) continue;

              if (parsed.event === "thinking") {
                this.streaming.thinking += parsed.data.delta || "";
              } else if (parsed.event === "content") {
                this.streaming.content += parsed.data.delta || "";
              } else if (parsed.event === "error") {
                throw new Error(parsed.data.detail || "Stream error");
              } else if (parsed.event === "done") {
                return parsed.data;
              }
            }
          }
          throw new Error("Stream ended without done event");
        },

        buildUserMessage(labels) {
          return (
            `Напиши один короткий анекдот про опоссума, используя темы: ${labels.join(", ")}.`
          );
        },

        async generate() {
          const labels = this.selectedLabels();
          if (labels.length < 1 || this.loading) return;

          this.error = "";
          this.trimmed = false;
          this.loading = true;
          this.streaming = {
            active: true,
            loading: true,
            thinking: "",
            content: "",
            themeLabels: [...labels],
          };

          try {
            const response = await fetch("/api/chat/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                messages: [{ role: "user", content: this.buildUserMessage(labels) }],
                provider: "local",
              }),
            });

            if (!response.ok) {
              const data = await response.json().catch(() => ({}));
              throw new Error(
                typeof data.detail === "string" ? data.detail : `HTTP ${response.status}`
              );
            }

            const done = await this.consumeStream(response);
            this.results.push({
              themeLabels: [...labels],
              content: done.reply || this.streaming.content,
              thinking: done.thinking || this.streaming.thinking,
              thinkingCollapsed: true,
              latencyMs: done.latency_ms,
            });
            this.lastLatencyMs = done.latency_ms;
            this.trimmed = Boolean(done.trimmed);
          } catch (err) {
            this.error = String(err);
          } finally {
            this.loading = false;
            this.streaming = {
              active: false,
              loading: false,
              thinking: "",
              content: "",
              themeLabels: [],
            };
          }
        },
      };
    }
  </script>
</body>
</html>
